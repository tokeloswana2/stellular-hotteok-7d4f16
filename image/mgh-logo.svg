<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Municipal Governance Hub Logo</title>
  <desc id="desc">A bold MGH logo with a yellow, green and blue geometric mark and the words Municipal Governance Hub.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f6d928"/>
      <stop offset="100%" stop-color="#e0c31a"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" x2="1">
      <stop offset="0%" stop-color="#367d3a"/>
      <stop offset="100%" stop-color="#0d5d31"/>
    </linearGradient>
  </defs>

  <g transform="translate(25, 20)">
    <path d="M0 330 C 120 260, 140 140, 210 70 L 350 240 C 280 330, 250 420, 150 520 L 0 330 Z" fill="url(#gold)"/>
    <path d="M150 520 L 530 120 L 600 200 L 330 520 Z" fill="#0e0e0e"/>
    <path d="M313 380 L 520 160 L 640 250 L 465 520 Z" fill="url(#forest)"/>
    <path d="M470 520 L 680 280 L 760 360 L 570 520 Z" fill="#0d4bb1"/>
    <path d="M130 520 L 300 300 L 420 520 Z" fill="#0e0e0e" opacity="0.96"/>

    <text x="410" y="350" font-size="380" font-weight="900" font-family="Arial Black, Segoe UI, sans-serif" fill="#0d0d0d" letter-spacing="-22">MGH</text>
    <text x="420" y="470" font-size="94" font-weight="900" font-family="Arial Black, Segoe UI, sans-serif" fill="#d11212" letter-spacing="1">MUNICIPAL GOVERNANCE HUB</text>
  </g>
</svg>
