<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="logo-title">
  <title id="logo-title">MGH Municipal Governance Hub</title>
  
  <!-- White background -->
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Geometric mark: Yellow shape -->
  <path fill="#fff000" d="M40 280c20-60 70-100 130-130l160-80v75c0 45-20 80-60 105L40 380c-14-25-18-50-13-80z"/>
  
  <!-- Geometric mark: Green shape -->
  <path fill="#2d7d38" d="M40 380c15-45 45-75 90-100l200-115v75c0 48-22 80-65 105L40 470c-14-28-18-65-12-100z"/>
  
  <!-- Geometric mark: Blue triangle -->
  <path fill="#0d4ea8" d="M220 430l120-65v120l-120-55z"/>

  <!-- Main text: MGH -->
  <text x="340" y="320" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" letter-spacing="-15">
    <tspan fill="#050505">M</tspan><tspan fill="#2d7d38">G</tspan><tspan fill="#050505">H</tspan>
  </text>

  <!-- Subtext: MUNICIPAL GOVERNANCE HUB -->
  <text x="360" y="420" font-family="Arial, sans-serif" font-size="68" font-weight="900" fill="#d61919" letter-spacing="0.5">MUNICIPAL GOVERNANCE HUB</text>
</svg>
