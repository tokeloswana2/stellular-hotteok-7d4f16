<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">Municipal Governance Hub logo</title>
  <desc id="desc">A clear vector version of the Municipal Governance Hub logo with yellow, green, blue, and black geometric branding and red text.</desc>

  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f6d92d"/>
      <stop offset="100%" stop-color="#d7be18"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f7d3e"/>
      <stop offset="100%" stop-color="#0d5d2f"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,30)">
    <path d="M50 470 C 120 350, 230 190, 360 115 L 480 220 C 430 300, 400 370, 310 520 L 50 470 Z" fill="url(#gold)"/>

    <path d="M290 550 L 680 185 L 820 290 L 470 620 Z" fill="#111111"/>
    <path d="M430 635 L 770 215 L 905 325 L 600 655 Z" fill="url(#green)"/>
    <path d="M705 620 L 930 345 L 1018 420 L 820 660 Z" fill="#0d4da3"/>

    <path d="M260 530 L 395 410 L 560 530 L 430 670 L 260 530 Z" fill="#111111" opacity="0.96"/>

    <text x="435" y="420" font-size="430" font-weight="900" font-family="Arial Black, Segoe UI, sans-serif" fill="#0d0d0d" letter-spacing="-24">MGH</text>
    <text x="450" y="585" font-size="108" font-weight="900" font-family="Arial Black, Segoe UI, sans-serif" fill="#d91d1d" letter-spacing="1">MUNICIPAL GOVERNANCE HUB</text>
  </g>
</svg>
